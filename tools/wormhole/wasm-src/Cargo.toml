[package]
name = "wormhole-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures = "0.3"
url = "2"
console_error_panic_hook = "0.1"

[dependencies.magic-wormhole]
version = "0.8.1"
default-features = false
features = ["transfer"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
