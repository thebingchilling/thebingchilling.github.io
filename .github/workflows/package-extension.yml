# Builds extension/ into a signed .crx.
#
# Every CRX is signed, and the key it is signed with is the extension's
# identity — the ID Chrome files it under is the SHA-256 of the matching
# public key. This extension is not distributed and is not updated in
# place, so it does not need that identity to be stable: the run generates
# a key, signs with it, and destroys it. Each build is therefore a fresh
# extension ID, which matters only if you wanted an installed copy to
# accept a later build as an update to itself. It will not.
#
# If that ever becomes wanted, put a PEM in the CRX_PRIVATE_KEY secret and
# this uses it instead, with no other change: same ID on every build, and
# the key never in the repository.

name: Package extension

on:
  push:
    branches: [main]
    # Tag ext-v1.0.0 to cut a release; the tag must match the manifest.
    tags: ["ext-v*"]
  workflow_dispatch:

# No `paths:` filter here on purpose. GitHub ANDs the ref filter with the
# path filter, so adding one would mean a release tag only built when the
# tagged commit happened to touch extension/ — which is exactly when it
# usually does not. The build is a zip and a signature; it costs seconds.

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the source parses
        run: |
          node --check extension/background.js
          node --check extension/lib/scope.js
          node --check .github/scripts/pack-crx.mjs
          node -e 'JSON.parse(require("fs").readFileSync("extension/manifest.json","utf8"))'

      # downloads/ is committed so the site can serve it, which means it
      # can drift from extension/ the moment someone edits one and not the
      # other. Nothing about a stale build looks wrong, so check rather
      # than trust: unwrap both and diff them against the source.
      - name: downloads/ matches extension/
        run: |
          tmp=$(mktemp -d)
          unzip -q downloads/bingqilin-popup-blocker.zip -d "$tmp/from-zip"
          diff -r --exclude=README.md "$tmp/from-zip" extension
          node .github/scripts/crx-unwrap.mjs \
            downloads/bingqilin-popup-blocker.crx "$tmp/inner.zip"
          unzip -q "$tmp/inner.zip" -d "$tmp/from-crx"
          diff -r --exclude=README.md "$tmp/from-crx" extension
          echo "downloads/ is current"

      - name: Read the version
        id: meta
        run: |
          version=$(node -p 'require("./extension/manifest.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $version"

      # A release tagged ext-v1.2.3 that ships a manifest saying 1.0.0 is a
      # release nobody can reason about afterwards, so refuse it here.
      - name: Tag must match the manifest
        if: startsWith(github.ref, 'refs/tags/ext-v')
        run: |
          tag="${GITHUB_REF_NAME#ext-v}"
          if [ "$tag" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::error::tag ext-v$tag does not match manifest version ${{ steps.meta.outputs.version }}"
            exit 1
          fi

      # -X drops the uid/gid and extra-attribute blocks, which are noise
      # that differs between runners and would change the signature for an
      # otherwise identical build.
      # README.md is left out: it documents the repo's layout and build,
      # which is nothing a shipped extension needs, and keeping it in meant
      # editing the docs invalidated every built artifact.
      - name: Zip the extension
        run: |
          cd extension
          zip -qrX "$GITHUB_WORKSPACE/bingqilin-popup-blocker-${{ steps.meta.outputs.version }}.zip" . \
            -x '.*' -x 'README.md'
          cd -
          unzip -Z1 "bingqilin-popup-blocker-${{ steps.meta.outputs.version }}.zip"

      - name: Sign into a .crx
        id: crx
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          # 077 before the key exists, not after: a private key that is
          # briefly world-readable was briefly world-readable.
          umask 077

          if [ -n "$CRX_PRIVATE_KEY" ]; then
            printf '%s\n' "$CRX_PRIVATE_KEY" > key.pem
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the CRX_PRIVATE_KEY secret."
          else
            openssl genrsa 4096 2>/dev/null > key.pem
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "No CRX_PRIVATE_KEY secret; generated a key for this run."
          fi

          node .github/scripts/pack-crx.mjs \
            "bingqilin-popup-blocker-${{ steps.meta.outputs.version }}.zip" \
            key.pem \
            "bingqilin-popup-blocker-${{ steps.meta.outputs.version }}.crx" \
            | tee crx.log

          # The key is never an artifact and never outlives the job. A
          # generated one has nothing worth keeping; a secret one is
          # already kept somewhere it belongs.
          shred -u key.pem
          sed -n 's/^extension id: /id=/p' crx.log >> "$GITHUB_OUTPUT"

      - name: Summarise
        run: |
          {
            echo "### Bingqilin Popup Blocker ${{ steps.meta.outputs.version }}"
            echo
            echo "Extension ID: \`${{ steps.crx.outputs.id }}\`"
            echo
            if [ "${{ steps.crx.outputs.stable }}" = "true" ]; then
              echo "Signed with the \`CRX_PRIVATE_KEY\` secret, so that ID is stable"
              echo "across builds. If it changes, the key changed with it."
            else
              echo "Signed with a key generated for this run and then destroyed, so"
              echo "the next build gets a different ID. Chrome will treat it as a"
              echo "separate extension rather than an update to this one — remove"
              echo "the old copy when you install a new build."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bingqilin-popup-blocker-${{ steps.meta.outputs.version }}
          path: |
            bingqilin-popup-blocker-*.zip
            bingqilin-popup-blocker-*.crx
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/ext-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach the build to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Popup Blocker ${GITHUB_REF_NAME#ext-v}" \
            --generate-notes \
            bingqilin-popup-blocker-*.zip bingqilin-popup-blocker-*.crx
